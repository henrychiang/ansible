
---
- name: my-repo-server
  yum: name=httpd state=present

- name: my-repo-conf
  template:
    src: yum.conf.js
    dest: /etc/httpd/conf.d/yum.conf

- name: my-httpd-conf
  template:
    src: httpd.conf.js
    dest: /etc/httpd/conf/httpd.conf

- name: restart
  service: name=httpd state=restarted

